<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
    @page {
        size: Letter;
        margin: 0.6in 0.7in;
    }
    body {
        font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
        font-size: 9.5pt;
        line-height: 1.3;
        color: #1a1a1a;
    }
    h1 {
        font-size: 18pt;
        margin: 0 0 0.1em 0;
        color: #0d47a1;
        border-bottom: 1.5px solid #0d47a1;
        padding-bottom: 0.1em;
    }
    h2 {
        font-size: 11pt;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        margin: 0.6em 0 0.2em 0;
        color: #1565c0;
        border-bottom: 1px solid #bbb;
        padding-bottom: 0.05em;
    }
    h3 {
        font-size: 10pt;
        margin: 0.4em 0 0.05em 0;
    }
    /* The dates paragraph that follows an h3 — italic, tight, on its own line */
    h3 + p {
        margin: 0 0 0.15em 0;
        font-style: italic;
        color: #444;
    }
    ul {
        list-style-type: disc;
        margin: 0.15em 0;
        padding-left: 1.2em;
    }
    li {
        display: list-item;
        margin-bottom: 0.05em;
        page-break-inside: avoid;
    }
    p {
        margin: 0.2em 0;
    }
    strong {
        color: #1a1a1a;
    }
    a {
        color: #1565c0;
        text-decoration: none;
    }
    /* Skills list: keep compact even if Claude returns a list */
    h2 + ul, h2 + p {
        margin-top: 0.1em;
    }
</style>
</head>
<body>
{{ content }}
</body>
</html>
