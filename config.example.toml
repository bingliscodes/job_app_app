[user]
name = "Your Name"
email = "you@example.com"
phone = ""
resume_path = "./my_resume.pdf"

[preferences]
roles = ["backend engineer", "software engineer", "full-stack developer"]
# Locations are matched OR-style. "Remote" picks up remote roles; add city
# names for hybrid/in-person searches.
locations = ["Remote", "San Francisco, CA"]
# Adzuna country endpoint (ISO 3166-1 alpha-2): us, gb, au, ca, etc.
country = "us"
max_results_per_source = 25
days_posted = 7
# Years-of-experience range. Filters out jobs with senior-coded titles
# (Senior/Staff/Principal/Lead/etc.) and jobs whose descriptions require
# more than max_years. Jobs with no detectable experience signal are kept.
min_years = 0
max_years = 4

[api_keys]
# Can also be set via environment variables (ANTHROPIC_API_KEY, ADZUNA_APP_ID, ADZUNA_APP_KEY)
anthropic = ""
adzuna_app_id = ""
adzuna_app_key = ""

[ai]
model = "claude-sonnet-4-20250514"
max_tokens = 4096

[output]
directory = "./output"
